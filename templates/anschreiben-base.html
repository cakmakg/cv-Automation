<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Anschreiben — Gökhan Cakmak</title>
<style>
  @font-face { font-family: 'Space Grotesk'; src: url('../fonts/space-grotesk-latin.woff2') format('woff2'); font-weight: 300 700; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Space Grotesk'; src: url('../fonts/space-grotesk-latin-ext.woff2') format('woff2'); font-weight: 300 700; font-style: normal; font-display: swap; }
  @font-face { font-family: 'DM Sans'; src: url('../fonts/dm-sans-latin.woff2') format('woff2'); font-weight: 100 1000; font-style: normal; font-display: swap; }
  @font-face { font-family: 'DM Sans'; src: url('../fonts/dm-sans-latin-ext.woff2') format('woff2'); font-weight: 100 1000; font-style: normal; font-display: swap; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: 'DM Sans', sans-serif; font-size: 12.5px; line-height: 1.65; color: #2a2a3a; background: #fff; }
  .page { width: 100%; max-width: 210mm; margin: 0 auto; padding: 0; }

  .header { margin-bottom: 10px; }
  .header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; color: #1a1a2e; }
  .header .contact-row { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 11px; color: #555; margin-top: 8px; }
  .header .contact-row .sep { color: #ccc; }

  .header-gradient { height: 3px; background: linear-gradient(to right, hsl(187, 74%, 32%), hsl(270, 70%, 45%)); border-radius: 2px; margin-bottom: 22px; }

  .meta-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; }
  .recipient { font-size: 12px; color: #333; line-height: 1.55; }
  .date { font-size: 12px; color: #333; text-align: right; }

  .subject { font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; font-weight: 600; color: #1a1a2e; margin-bottom: 18px; }

  .anrede { font-size: 12.5px; margin-bottom: 14px; }
  .body p { font-size: 12.5px; margin-bottom: 12px; line-height: 1.65; }

  .closing { font-size: 12.5px; margin-top: 16px; }
  .signature { font-family: 'Space Grotesk', sans-serif; font-size: 14px; color: #1a1a2e; margin-top: 26px; }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>Gökhan Cakmak</h1>
    <div class="contact-row">
      <span>53121 Bonn, Deutschland</span>
      <span class="sep">|</span>
      <span>+49 163 9734475</span>
      <span class="sep">|</span>
      <span>gokhan.cakmak@web.de</span>
    </div>
  </div>
  <div class="header-gradient"></div>

  <div class="meta-row">
    <div class="recipient">{{RECIPIENT}}</div>
    <div class="date">Bonn, {{DATE}}</div>
  </div>

  <div class="subject">{{SUBJECT}}</div>

  <div class="body">
    <p class="anrede">Sehr geehrte Damen und Herren,</p>
    {{PARAGRAPHS}}
    <p class="closing">Über ein persönliches Gespräch würde ich mich freuen.</p>
    <p>Mit freundlichen Grüßen</p>
  </div>

  <div class="signature">Gökhan Cakmak</div>

</div>
</body>
</html>
